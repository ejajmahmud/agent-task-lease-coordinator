[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-task-lease-coordinator"
version = "0.1.0"
description = "High-reliability distributed lease and lock coordinator with heartbeat keep-alives and dead-letter recovery"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-task-lease-coordinator = "agent_task_lease_coordinator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_task_lease_coordinator*"]
